name: 'main'
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The same Node major the action runs on (`using: node24`).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run all
      # `dist/` is what the action runs, so it has to match the source.
      - name: Check dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git status --porcelain dist
            echo '::error::dist/ is out of date. Run `npm run all` and commit the result.'
            exit 1
          fi
