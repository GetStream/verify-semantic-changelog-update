name: 'main'
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The same Node major the action runs on (`using: node24`).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run all
      # `npm run all` formats the source and rebuilds `dist/`, which is what the
      # action runs. Either one changing means the commit was not up to date.
      - name: Check nothing changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo '::error::Formatting or dist/ is out of date. Run `npm run all` and commit the result.'
            exit 1
          fi
